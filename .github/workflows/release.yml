# Shared release transaction pinned to a verified canonical release.
name: Daily Release
on:
  schedule:
    - cron: 23 3 * * *
    - cron: 41 * * * *
  workflow_dispatch:
    inputs:
      retire-unpublished:
        description: Retire only owned untouched unpublished intent
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      id-token: write
      issues: write
    uses: unbraind/pm-ops/.github/workflows/daily-release.yml@6fa60e56331d0fd831421f2221d46d038d4a2360 # v2026.11.19
    with:
      reconcile-only: ${{ (github.event_name == 'schedule' && github.event.schedule ==
        '41 * * * *') || inputs.retire-unpublished == true }}
      retire-unpublished: ${{ github.event_name == 'workflow_dispatch' &&
        inputs.retire-unpublished == true }}
      release-enabled: ${{ github.ref == 'refs/heads/main' }}
      prepare-script: release:update-version
      node-version: 22.18.0
